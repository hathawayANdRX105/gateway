name: Benchmark (manual)

# Manual benchmark lane. GitHub-hosted runners are the stable, clean environment
# for numbers that may be shared in a PR or issue; the same scripts/bench.sh entry
# produces the same table locally via `just bench`.
on:
  # TEMP-TEST trigger: final validation of review fixes.
  push:
    branches: [perf/cache-key-bytes]
  workflow_dispatch:
    inputs:
      destination:
        description: "Also post the table to an issue or PR (artifact + summary always happen)"
        type: choice
        options: [none, issue, pr]
        default: none
      number:
        description: "Issue or PR number; required when destination is issue or pr"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-20
      - uses: Swatinem/rust-cache@v2
        with:
          # Same cache namespace as ci.yml, so dependency compilation is reused.
          key: cargo-shared
      - name: Validate comment inputs
        if: github.event_name == 'workflow_dispatch' && inputs.destination != 'none' && inputs.number == ''
        run: |
          echo "::error::number is required when destination is issue or pr"
          exit 1
      # Criterion's default Baseline::Save writes each run into `base/` itself; we
      # only persist that directory across runs so the report's `vs base` column
      # carries a real regression signal. Each run restores the prior cache (latest
      # by prefix) and writes a fresh one keyed by run id.
      - name: Restore baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-
      - name: Run benchmarks and build report
        run: bash scripts/bench.sh benches/REPORT.md
      # callgrind is user-mode instrumentation: unlike perf it needs no kernel
      # perf_event permission, which hosted runners deny (paranoid=4).
      - name: CPU sampling (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind >/dev/null
          bash scripts/bench-cpu.sh cache_ops gateway-cache 40
          # Regenerate the report either way: with function costs when sampling
          # succeeded, or with the diagnostic reason from perf-status.txt.
          args=(--out benches/REPORT.md)
          if [ -s benches/perf-folded.txt ]; then
            args+=(--perf-folded benches/perf-folded.txt)
          fi
          python3 benches/bench_report.py "${args[@]}"
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benches/REPORT.md
            target/criterion/*/*/new/estimates.json
            benches/perf-folded.txt
            benches/perf-status.txt
            benches/callgrind-annotate.txt
          if-no-files-found: warn
      - name: Publish table to job summary
        run: |
          {
            echo '## Gateway benchmark report (manual CI run)'
            echo
            echo 'Raw benchmark tool data; generated by `scripts/bench.sh`.'
            echo
            cat benches/REPORT.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on issue or PR
        if: github.event_name == 'workflow_dispatch' && inputs.destination != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          {
            echo "## Gateway benchmark report (CI run $GITHUB_RUN_ID)"
            echo
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH / $RUNNER_NAME"
            echo
            cat benches/REPORT.md
          } > /tmp/gateway-benchmark-comment.md
          if [ "$DESTINATION" = "pr" ]; then
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gateway-benchmark-comment.md
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gateway-benchmark-comment.md
          fi
