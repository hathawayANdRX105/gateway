name: Benchmark (manual)

# Manual benchmark lane. GitHub-hosted runners are the stable, clean environment
# for numbers that may be shared in a PR or issue; the same scripts/bench.sh entry
# produces the same table locally via `just bench`.
on:
  # TEMP-TEST: push trigger only to exercise this workflow before it lands on main.
  push:
    branches: [chore/benchmark-ci-entry]
  workflow_dispatch:
    inputs:
      destination:
        description: "Also post the table to an issue or PR (artifact + summary always happen)"
        type: choice
        options: [none, issue, pr]
        default: none
      number:
        description: "Issue or PR number; required when destination is issue or pr"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-20
      - uses: Swatinem/rust-cache@v2
        with:
          # Same cache namespace as ci.yml, so dependency compilation is reused.
          key: cargo-shared
      - name: Validate comment inputs
        if: github.event_name == 'workflow_dispatch' && inputs.destination != 'none' && inputs.number == ''
        run: |
          echo "::error::number is required when destination is issue or pr"
          exit 1
      - name: Run benchmarks and build report
        run: bash scripts/bench.sh benches/REPORT.md
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benches/REPORT.md
            target/criterion/*/*/new/estimates.json
          if-no-files-found: error
      - name: Publish table to job summary
        run: |
          {
            echo '## Gateway benchmark report (manual CI run)'
            echo
            echo 'Raw benchmark tool data; generated by `scripts/bench.sh`.'
            echo
            cat benches/REPORT.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on issue or PR
        if: github.event_name == 'workflow_dispatch' && inputs.destination != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          {
            echo "## Gateway benchmark report (CI run $GITHUB_RUN_ID)"
            echo
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH / $RUNNER_NAME"
            echo
            cat benches/REPORT.md
          } > /tmp/gateway-benchmark-comment.md
          if [ "$DESTINATION" = "pr" ]; then
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gateway-benchmark-comment.md
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/gateway-benchmark-comment.md
          fi
