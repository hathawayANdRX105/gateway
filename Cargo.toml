# Workspace root for the gateway data plane.
#
# This is the public home of the gateway: the contract vocabulary shared by
# the two planes, the engine stages (admission / selection / forwarding /
# metering / protocol / proxy / security), the assembly facade a consumer
# wires up, and the standalone process entry (root `src/`, axum).
#
# Layout:
#   src/                         Standalone daemon entry: config + catalog + axum transport.
#   crates/gateway-facade        The one crate a consumer depends on: config + builder + presets.
#   crates/gateway-core          Vocabulary + ports (records, snapshots, admin-plane traits).
#   crates/gateway-pipeline      Stage trait, RequestCtx, Pipeline runner, axum.
#   crates/gateway-gate          Admission gates (auth / quota / rate / model).
#   crates/gateway-dispatch      Catalog selection (pluggable strategies: P2C / weighted random, priority tiers, context fit) + health table.
#   crates/gateway-forward       Upstream forwarding and stream orchestration.
#   crates/gateway-protocol-bridge  Inbound dialect + codec adaptation.
#   crates/gateway-proxy         Egress proxy pool (reqwest + meow-rs).
#   crates/gateway-cache         Bounded store primitive + response cache (moka).
#   crates/gateway-security      Sensitive-word filter (Aho-corasick).
#   crates/gateway-metering      Ledger ports, price arithmetic, token estimation, calibration.
#
# Dependency direction is one-way: the facade and the engines depend on
# gateway-core, never the reverse; the facade depends on the engines, never the
# other way around. A consumer depends on gateway-facade only. The daemon
# depends on the facade plus its own transport crates (axum / tokio) and names no
# engine crate. Engine-to-engine edges (all in [dependencies], so the shipped
# graph stays acyclic): forward → dispatch (retry loop reports FailureClass),
# forward → gate / protocol-bridge / proxy / security / metering / cache,
# gate → metering (ledger ports), dispatch → gate / cache / metering (context-fit
# token estimation). dispatch → forward and dispatch → protocol-bridge are
# test-only and live in dispatch's [dev-dependencies].

[package]
name = "gateway-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Standalone gateway process: axum transport over the gateway-facade data plane"

[[bin]]
name = "gatewayd"
path = "src/main.rs"

[dependencies]
gateway-facade = { path = "crates/gateway-facade" }
axum = { workspace = true }
arc-swap = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
futures-util = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["crates/gateway-facade", "crates/gateway-*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# Publishing to crates.io is a later phase of the split; every member
# stays private until that release step flips this per crate.
publish = false

[workspace.lints.clippy]
# A two-way choice is a plain if/else; chained combinators that disguise it are denied.
pedantic = "deny"
obfuscated_if_else = "deny"
manual_map = "deny"
manual_filter = "deny"
manual_filter_map = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_unwrap_or = "deny"
manual_ok_or = "deny"
manual_let_else = "deny"
question_mark = "deny"
map_entry = "deny"
while_let_on_iterator = "deny"
needless_range_loop = "deny"
bool_comparison = "deny"
redundant_pattern_matching = "deny"
derivable_impls = "deny"
needless_return = "deny"
collapsible_if = "deny"
collapsible_else_if = "deny"
single_match = "deny"
redundant_else = "deny"
unnecessary_map_or = "deny"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "sync",
    "time",
    "io-util",
] }
axum = "0.8"
http = "1"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
base64 = "0.22"
arc-swap = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
rand = "0.8"
futures-util = "0.3"
# Egress protocol assembly (meow-rs): clash-style config → protocol/transport chain.
meow-common = "0.21"
meow-config = { version = "0.21", default-features = false, features = [
    "ss",
    "trojan",
    "vless",
    "vless-vision",
    "vmess",
    "hysteria2",
    "anytls",
    "snell",
] }
smol_str = "0.3"
# Cache substrate (crates/gateway-cache is the only owner).
moka = { version = "0.12", features = ["sync", "atomic64"] }
dashmap = "6"
aho-corasick = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1

# CI quality gate: LLVM codegen (host dev builds use Cranelift via
# .cargo/config.toml; this profile opts out — same contract as ferrite).
# debug is restored to line-tables-only because a CI panic without file:line
# is not triageable.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
