[package]
name = "gateway-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true

# Cross-domain injection surface between the admin plane and the data plane.
#
# `crates/api-*` must not depend on the data-plane implementation crates
# (gateway-dispatch / gateway-forward / gateway-gate / ...). What both sides
# genuinely agree on lives here instead: vocabulary types plus the minimal ports
# the admin plane calls into a running data plane.
#
# Dependency discipline (enforced by scripts/layering-policy.toml): the only
# internal dependency allowed is `app-contract`; `gateway-contract -> gateway-*` is a
# forbidden edge, so this crate can never grow back into the implementations it
# exists to hide.

[dependencies]
app-contract = { path = "../app-contract" }
arc-swap     = { workspace = true }
dashmap = { workspace = true }
serde        = { workspace = true }
tracing      = { workspace = true }
# Proxy vocabulary: the URL / share-link parsers are pure configuration mapping (no dialing),
# so they belong with the types they produce. `base64` + `serde_json` decode the vmess payload,
# `url` splits the link, `percent-encoding` decodes link components.
base64           = { workspace = true }
percent-encoding = "2"
serde_json       = { workspace = true }
thiserror        = { workspace = true }
url              = { workspace = true }

[lints]
workspace = true
