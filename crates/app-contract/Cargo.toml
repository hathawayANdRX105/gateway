[package]
name = "app-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true

# Contract layer — the bottom of the workspace dependency graph.
# Dependency discipline: only pure data and pure serialization dependencies such as
# serde / uuid / chrono / thiserror are allowed.
# tokio / sqlx / axum / reqwest / dioxus are forbidden — this crate must compile on
# wasm32, and any native-only dependency immediately breaks the web build (that is the
# machine check for boundary violations).

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }

# wasm randomness source: uuid v7 needs getrandom's js backend (see topology doc 05 §5)
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[lints]
workspace = true
