[package]
name = "gateway-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Cache substrate for the gateway data plane.
#
# This crate owns the only `moka` dependency in the gateway closure: the bounded
# concurrent store primitive lives here once, and every gateway cache (sticky
# bindings, egress client pools, the response cache) configures and uses it
# instead of re-deriving the capacity / TTL / eviction spell per consumer.
#
# The response cache is the data-plane layer of "skip the repeat LLM call": a
# byte-identical non-streaming request is served from the previous upstream
# answer. Keys are isolation-scoped (user + group), so a cached answer is only
# ever replayed to the identity that produced it.

[dependencies]
moka    = { workspace = true }
sha2    = { workspace = true }
bytes   = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = "0.5" # bench harness: not a workspace dep
# Hash-candidate comparison (benches/hash_candidates.rs + tests/hash_consistency.rs).
# Dev-only: none of these reach the shipped dependency graph.
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
twox-hash = "2"
siphasher = "1"
ahash = "0.8"
foldhash = "0.2"
rand = { workspace = true }

[[bench]]
name = "cache_ops"
path = "../../benches/cache_ops.rs"
harness = false

[[bench]]
name = "hash_candidates"
path = "../../benches/hash_candidates.rs"
harness = false

[lints]
workspace = true
