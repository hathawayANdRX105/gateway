[package]
name = "gateway-gate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gateway-pipeline = { path = "../gateway-pipeline" }
gateway-metering = { path = "../gateway-metering" }
gateway-contract      = { path = "../gateway-contract" }
app-contract     = { path = "../app-contract" }

tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }
arc-swap = { workspace = true }
dashmap = { workspace = true }
# parking_lot stays a crates.io dep (not in the workspace table)
parking_lot = "0.12"
http = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
