[package]
name = "gateway-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Dispatch state machine — picks the execution unit for this request from the candidate RouteUnits.
# Input: catalog snapshot (read-only) + local health observations; output: one forwardable target.

[dependencies]
gateway-pipeline = { path = "../gateway-pipeline" }
gateway-contract      = { path = "../gateway-contract" }
app-contract    = { path = "../app-contract" }
serde_json = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
rand     = { workspace = true }
chrono   = { workspace = true }
tracing  = { workspace = true }
gateway-gate = { path = "../gateway-gate" }
gateway-cache = { path = "../gateway-cache" }
dashmap = { workspace = true }
tokio    = { workspace = true, features = ["time"] }
[dev-dependencies]
tokio = { workspace = true }
gateway-forward = { path = "../gateway-forward" }
gateway-protocol-bridge = { path = "../gateway-protocol-bridge" }
bytes = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
serde_json = { workspace = true }
criterion = "0.5"  # bench harness: not a workspace dep

# P2C latency-factor benchmark (EWMA baseline vs mounted t-digest). Local only, not run in CI.
[[bench]]
name = "selector_latency"
harness = false

[lints]
workspace = true
