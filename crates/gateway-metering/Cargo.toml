[package]
name = "gateway-metering"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Metering — prehold, streamed token scanning, UsageEvent persistence. Forwarding never
# blocks billing.

[dependencies]
gateway-core = { path = "../gateway-core" }
# Settlement vocabulary + ports (SettleSink, PriceTable) live on the injection surface so
# the billing crate can implement them without depending on this engine.
serde    = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono   = { workspace = true }
bytes    = { workspace = true }
# CalibrationLog's ring mutex: parking_lot guards return directly (no poison unwrap),
# matching the rule applied to every immediately-unwrapped std lock.
parking_lot = "0.12"

[lints]
workspace = true
