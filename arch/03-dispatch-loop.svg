<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1400" height="1360" fill="#ffffff"/><rect x="0" y="0" width="1400" height="112" rx="0" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="700.0" y="50" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">03 · 选路 —— 策略是可插拔的，P2C 只是默认</text><text x="700.0" y="82" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="middle">外部注入策略 · 装配期选定一个 · 策略之上还有优先级分层与限流重抽</text><text x="40" y="142" font-size="14" fill="#64748b" font-weight="700" text-anchor="start">① 策略从哪里来：配置 + 外部注入</text><rect x="40" y="158" width="250" height="96" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/><text x="54" y="180.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">SelectorKind</text><text x="54" y="203.05" font-size="12" fill="#334155" font-weight="400" text-anchor="start">boot 期读一次</text><text x="54" y="221.65" font-size="12" fill="#334155" font-weight="400" text-anchor="start">core/dispatch.rs:54</text><text x="54" y="240.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">P2c（默认）| WeightedRandom</text><rect x="330" y="158" width="250" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="344" y="180.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">wire_signals</text><text x="344" y="203.05" font-size="12" fill="#334155" font-weight="400" text-anchor="start">match kind → 装策略</text><text x="344" y="221.65" font-size="12" fill="#334155" font-weight="400" text-anchor="start">facade/builder.rs:441</text><text x="344" y="240.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">sticky_boost 随策略传入</text><rect x="620" y="158" width="300" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="634" y="180.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">SelectorSlot</text><text x="634" y="203.05" font-size="12" fill="#334155" font-weight="400" text-anchor="start">P2c(P2CSelector)</text><text x="634" y="221.65" font-size="12" fill="#334155" font-weight="400" text-anchor="start">| Custom(Box&lt;dyn Selector&gt;)</text><text x="634" y="240.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">dispatch/lib.rs:218</text><rect x="960" y="158" width="400" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="974" y="180.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Selector（端口）</text><text x="974" y="203.05" font-size="12" fill="#334155" font-weight="400" text-anchor="start">pick(units, health, exclude, sticky, now, rng)</text><text x="974" y="221.65" font-size="12" fill="#334155" font-weight="400" text-anchor="start">→ Option&lt;&amp;RouteUnitRecord&gt;</text><text x="974" y="240.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">selector.rs:97</text><line x1="290" y1="206" x2="328" y2="206" stroke="#475569" stroke-width="1.9" marker-end="url(#a)"/><line x1="580" y1="206" x2="618" y2="206" stroke="#475569" stroke-width="1.9" marker-end="url(#a)"/><line x1="920" y1="206" x2="958" y2="206" stroke="#475569" stroke-width="1.9" marker-end="url(#a)"/><text x="620" y="290" font-size="12.5" fill="#64748b" font-weight="700" text-anchor="start">SelectorSlot 的两个分支 + 一个扩展点</text><rect x="620" y="306" width="300" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="634" y="327.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">P2CSelector（内置·默认）</text><text x="634" y="350.77500000000003" font-size="12" fill="#334155" font-weight="400" text-anchor="start">prior 采样 → 后验比较</text><text x="634" y="369.37500000000006" font-size="12" fill="#334155" font-weight="400" text-anchor="start">prior = 权重 × ramp × sticky boost</text><text x="634" y="387.975" font-size="12" fill="#334155" font-weight="400" text-anchor="start">后验 = 延迟·健康·并发·token·tps</text><rect x="950" y="306" width="214" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="964" y="327.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">WeightedRandom</text><text x="964" y="350.77500000000003" font-size="12" fill="#334155" font-weight="400" text-anchor="start">只按静态权重抽</text><text x="964" y="369.37500000000006" font-size="12" fill="#334155" font-weight="400" text-anchor="start">无后验；衰减交给</text><text x="964" y="387.975" font-size="12" fill="#334155" font-weight="400" text-anchor="start">冷却/健康层</text><rect x="1194" y="306" width="166" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="1208" y="327.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">自定义策略</text><text x="1208" y="350.77500000000003" font-size="12" fill="#334155" font-weight="400" text-anchor="start">with_selector</text><text x="1208" y="369.37500000000006" font-size="12" fill="#334155" font-weight="400" text-anchor="start">（必须最后装）</text><line x1="720" y1="254" x2="720" y2="304" stroke="#dc2626" stroke-width="1.9" marker-end="url(#a)"/><line x1="1010" y1="254" x2="1050" y2="304" stroke="#dc2626" stroke-width="1.9" marker-end="url(#a)"/><path d="M 880 262 L 880 276 L 1240 276 L 1240 304" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ad)"/><rect x="40" y="434" width="1320" height="236" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="56" y="458" font-size="14.5" fill="#92400e" font-weight="700" text-anchor="start">② P2C 内部（默认策略才有这两层；WeightedRandom 只有第 1 步 + 抽签）</text><rect x="56" y="472" width="300" height="182" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="70" y="498" font-size="14" fill="#7c2d12" font-weight="700" text-anchor="start">过滤 eligible</text><text x="70" y="524.0" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">剔除 disabled / exclude</text><text x="70" y="541.7" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">/ 冷却中</text><text x="70" y="559.4" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">全空 → recall_fainted</text><text x="70" y="577.1" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">强行召回冷却最短者</text><line x1="357" y1="563" x2="377" y2="563" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/><rect x="378" y="472" width="300" height="182" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="392" y="498" font-size="14" fill="#7c2d12" font-weight="700" text-anchor="start">prior（采样层）</text><text x="392" y="524.0" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">share_i = w_i×ramp_i / Σ</text><text x="392" y="541.7" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">sticky 命中：×boost 再归一</text><text x="392" y="559.4" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">ramp 靠成功数自愈</text><text x="392" y="577.1" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">不掺任何实时状态</text><line x1="679" y1="563" x2="699" y2="563" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/><rect x="700" y="472" width="300" height="182" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="714" y="498" font-size="14" fill="#7c2d12" font-weight="700" text-anchor="start">likelihood（决策层）</text><text x="714" y="524.0" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">延迟 × 健康分 × 空闲并发</text><text x="714" y="541.7" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">× (1 − token 占用) × tps</text><text x="714" y="559.4" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">只在决策用，不改采样</text><text x="714" y="577.1" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">地板 0.05</text><line x1="1001" y1="563" x2="1021" y2="563" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/><rect x="1022" y="472" width="300" height="182" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="1036" y="498" font-size="14" fill="#7c2d12" font-weight="700" text-anchor="start">选定</text><text x="1036" y="524.0" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">比较后验取最高</text><text x="1036" y="541.7" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">过限流才返回</text><text x="1036" y="559.4" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">否则加进 refused</text><text x="1036" y="577.1" font-size="11.8" fill="#78350f" font-weight="400" text-anchor="start">重新分层再抽</text><rect x="40" y="694" width="1320" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="54" y="716.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">③ 策略之上还有一层（不属于任何策略）</text><text x="54" y="739.81" font-size="12.4" fill="#334155" font-weight="400" text-anchor="start">highest_tier：先按 channel.settings.priority 筛出最高优先层，策略只在这一层里选（dispatch/lib.rs:526）</text><text x="54" y="759.03" font-size="12.4" fill="#334155" font-weight="400" text-anchor="start">限流拒绝 → 候选进 refused → 下一轮重新分层，自动降层；降层是过滤器重跑，不是专门代码路径</text><text x="54" y="778.25" font-size="12.4" fill="#334155" font-weight="400" text-anchor="start">sticky 不跨层：低层的绑定渠道被直接丢弃（优先级压过粘连，同层内 boost 照常）</text><text x="40" y="844" font-size="14" fill="#64748b" font-weight="700" text-anchor="start">④ 重试循环（run_retry_loop）— 与策略无关</text><rect x="40" y="862" width="308" height="104" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="54" y="888" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">select</text><text x="54" y="914.0" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">排除已试 + 冷却中</text><text x="54" y="931.7" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">调策略取一个候选</text><line x1="349" y1="914" x2="369" y2="914" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/><rect x="370" y="862" width="308" height="104" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="384" y="888" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">attempt</text><text x="384" y="914.0" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">forward 单次 IO</text><text x="384" y="931.7" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">产出 AttemptOutcome</text><line x1="679" y1="914" x2="699" y2="914" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/><rect x="700" y="862" width="308" height="104" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="714" y="888" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">report</text><text x="714" y="914.0" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">健康表按五类记账</text><text x="714" y="931.7" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">冷却阶梯据此推进</text><line x1="1009" y1="914" x2="1029" y2="914" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/><rect x="1030" y="862" width="308" height="104" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="1044" y="888" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">mark_tried</text><text x="1044" y="914.0" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">加入 exclude</text><text x="1044" y="931.7" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">预算累加失败耗时</text><path d="M 1290 968 L 1290 992 L 194 992 L 194 970" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="742" y="988" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">受 max_attempts 与时间预算约束；成功不花预算，也不被预算切断</text><text x="40" y="1044" font-size="14" fill="#64748b" font-weight="700" text-anchor="start">⑤ 六种结果 → 健康记录 → 循环动作</text><rect x="40" y="1060" width="880" height="30" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/><text x="54" y="1080" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">结果</text><text x="344" y="1080" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">健康表记录</text><text x="634" y="1080" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">循环动作</text><rect x="40" y="1090" width="880" height="32" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="54" y="1111" font-size="11.8" fill="#0f172a" font-weight="600" text-anchor="start">Done{status,latency}</text><text x="344" y="1111" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">Success（唯一延迟样本）</text><text x="634" y="1111" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">结束返回</text><rect x="40" y="1120" width="880" height="32" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="54" y="1141" font-size="11.8" fill="#0f172a" font-weight="600" text-anchor="start">Retryable(class,_)</text><text x="344" y="1141" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">Fatal 类</text><text x="634" y="1141" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">mark_tried → 换候选</text><rect x="40" y="1150" width="880" height="32" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="54" y="1171" font-size="11.8" fill="#0f172a" font-weight="600" text-anchor="start">Fatal(class,_)</text><text x="344" y="1171" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">Fatal 类</text><text x="634" y="1171" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">结束，错误透传</text><rect x="40" y="1180" width="880" height="32" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="54" y="1201" font-size="11.8" fill="#0f172a" font-weight="600" text-anchor="start">FatalButSwitchable</text><text x="344" y="1201" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">Neutral（不改 EWMA）</text><text x="634" y="1201" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">换候选；全失败透传 4xx</text><rect x="40" y="1210" width="880" height="32" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="54" y="1231" font-size="11.8" fill="#0f172a" font-weight="600" text-anchor="start">Throttled{retry_after}</text><text x="344" y="1231" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">Throttled（独立阶梯）</text><text x="634" y="1231" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">mark_tried → 换候选</text><rect x="40" y="1240" width="880" height="32" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><text x="54" y="1261" font-size="11.8" fill="#0f172a" font-weight="600" text-anchor="start">WindowOverflow</text><text x="344" y="1261" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">Fatal 类</text><text x="634" y="1261" font-size="11.8" fill="#334155" font-weight="400" text-anchor="start">抬高 min_context 下限</text><text x="40" y="1294" font-size="11.6" fill="#475569" font-weight="400" text-anchor="start">冷却阶梯：cooldown = base + (max−base)×(n/N)^p，p=2 凸。Fatal 300ms→8s（N=12）；Throttled 343→475→693→1000ms（N=4）。两条阶梯互不污染，Retry-After 直接覆盖。</text></svg>