<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1320" viewBox="0 0 1560 1320" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1560" height="1320" fill="#ffffff"/><rect x="0" y="0" width="1560" height="118" rx="0" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="780.0" y="52" font-size="29" fill="#f8fafc" font-weight="700" text-anchor="middle">gateway 数据面心智模型 —— 全景</text><text x="780.0" y="86" font-size="14.5" fill="#94a3b8" font-weight="400" text-anchor="middle">一条请求 = 一个 RequestCtx 穿过 Vec&lt;Arc&lt;dyn Stage&gt;&gt;；Continue 前进，ShortCircuit / Stream 终止</text><text x="56" y="142" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">入口方言（同一端口，按路径分流）</text><rect x="56" y="150" width="236" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="72" y="173.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">[OI] Chat + Responses</text><text x="72" y="195.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">/v1/chat/completions</text><text x="72" y="214.6" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">/v1/responses</text><rect x="308" y="150" width="236" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="324" y="173.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Claude Messages</text><text x="324" y="195.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">/v1/messages</text><rect x="560" y="150" width="236" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="576" y="173.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Gemini</text><text x="576" y="195.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">/v1beta/models/{model}:{verb}</text><rect x="812" y="150" width="236" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="828" y="173.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Passthrough</text><text x="828" y="195.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">其他厂商 /v1/* 直通</text><rect x="56" y="256" width="1028" height="112" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/><text x="72" y="280.8" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">gateway-daemon（仓库根 src/，bin gatewayd）— 进程壳，零判权逻辑</text><text x="72" y="303.55" font-size="13" fill="#334155" font-weight="400" text-anchor="start">axum 一个 handler 拥有整条路径：body 上限（超限 413，stage 看不到）→ 建 RequestCtx → Pipeline::run → 响应逐帧回传</text><text x="72" y="323.05" font-size="13" fill="#334155" font-weight="400" text-anchor="start">TCP + UDS 双 listener；仅 peer ∈ trusted_proxies 才读 x-forwarded-for（自右向左，首个别受信地址胜出）；/healthz 与 /readyz 独立路由</text><text x="72" y="342.55" font-size="13" fill="#334155" font-weight="400" text-anchor="start">同时暴露 Gateway::router()（axum Router）供 ferrite 等消费方内嵌，与独立进程共用同一套栈与 http major</text><rect x="56" y="396" width="1028" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="72" y="418" font-size="15" fill="#14532d" font-weight="700" text-anchor="start">GateChain（crate gateway-gate）— 全部查本地 ArcSwap 快照，零跨网络调用</text><rect x="72.0" y="430" width="133.71428571428572" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="138.85714285714286" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">① auth</text><rect x="215.71428571428572" y="430" width="133.71428571428572" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="282.57142857142856" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">② state</text><rect x="359.42857142857144" y="430" width="133.71428571428572" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="426.28571428571433" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">③ model</text><rect x="503.14285714285717" y="430" width="133.71428571428572" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="570.0" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">④ group</text><rect x="646.8571428571429" y="430" width="133.71428571428572" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="713.7142857142858" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">⑤ quota</text><rect x="790.5714285714287" y="430" width="133.71428571428572" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="857.4285714285716" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">⑥ ratelimit</text><rect x="934.2857142857143" y="430" width="133.71428571428572" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1001.1428571428572" y="462" font-size="13.5" fill="#14532d" font-weight="700" text-anchor="middle">⑦ graylist</text><text x="72" y="512" font-size="13" fill="#166534" font-weight="400" text-anchor="start">任一闸门失败 → ShortCircuit（401 / 403 / 402 / 429），dispatch 永不进入。⑤ quota 同时完成「预扣」，凭证挂在 ctx.hold 上</text><text x="72" y="526" font-size="13" fill="#166534" font-weight="400" text-anchor="start">preset：Shape::Relay（上面这条） · NoBilling（去掉 quota，即使注入也丢弃） · Open（只剩 model-parse，认证由调用方自己承担）</text><rect x="56" y="564" width="1028" height="268" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="72" y="588" font-size="15" fill="#7f1d1d" font-weight="700" text-anchor="start">ForwardStage（crate gateway-forward）— 默认链的终点；选路在它内部，因此链上不再有 DispatchStage</text><rect x="72" y="604" width="230" height="148" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1.6"/><text x="88" y="627.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">① 响应缓存查询</text><text x="88" y="649.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">gate 之后、上游动作之前</text><text x="88" y="668.6" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">流式请求永不命中</text><text x="88" y="687.35" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">命中不报健康 / 不写 sticky</text><text x="88" y="706.1" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">不占并发与 token 预算</text><rect x="322" y="604" width="230" height="148" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1.6"/><text x="338" y="627.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">② 选路（策略可插拔）</text><text x="338" y="649.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">策略：P2c | WeightedRandom</text><text x="338" y="668.6" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">默认 P2C：prior × 后验</text><text x="338" y="687.35" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">延迟·健康·并发·token·tps</text><rect x="572" y="604" width="230" height="148" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1.6"/><text x="588" y="627.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">③ 单次尝试（纯 IO）</text><text x="588" y="649.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">adapter 组装 URL / 头 / 鉴权</text><text x="588" y="668.6" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">egress 发送（超时、h2 分片、</text><text x="588" y="687.35" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">按 alias 分池的客户端池）</text><text x="588" y="706.1" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">SSE 逐帧流回，不整包缓冲</text><rect x="822" y="604" width="230" height="148" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="1.6"/><text x="838" y="627.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">④ 健康上报</text><text x="838" y="649.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">AttemptOutcome 五类</text><text x="838" y="668.6" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">Success / Fatal /</text><text x="838" y="687.35" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">FatalButSwitchable /</text><text x="838" y="706.1" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">Throttled / WindowOverflow</text><line x1="303" y1="678" x2="321" y2="678" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a)"/><line x1="553" y1="678" x2="571" y2="678" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a)"/><line x1="803" y1="678" x2="821" y2="678" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a)"/><line x1="937.0" y1="754" x2="937.0" y2="784" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a)"/><path d="M 937.0 786 L 187.0 786" fill="none" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="5 4"/><line x1="187.0" y1="786" x2="187.0" y2="756" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="687.0" y="782" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle">重试循环：mark_tried → 排除 → 再选（受 max_attempts 与时间预算约束）</text><text x="72" y="818" font-size="13" fill="#7f1d1d" font-weight="400" text-anchor="start">结算提交点也在这层：settle(hold, actual) 退还差额 + 写缓存 + 产出 UsageEvent → SettleSink</text><rect x="56" y="896" width="1028" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="72" y="920.8" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">ProtocolBridgeStage（crate gateway-protocol-bridge）— 错误映射 + 响应封装</text><text x="72" y="943.55" font-size="13" fill="#334155" font-weight="400" text-anchor="start">响应转换的闭环不在这里：请求与响应必须共用同一套 codec，而两侧方言只在 forward::pipeline 同时可见（历史缺陷 G2 记录）</text><text x="72" y="963.05" font-size="13" fill="#334155" font-weight="400" text-anchor="start">本 stage 只做 NormalizedError → 方言错误形状，以及把 forward 准备好的响应包成 HTTP 响应</text><text x="56" y="1014" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">上游渠道（channels × keys × groups × models 展开成 RouteUnit）</text><rect x="56" y="1028" width="236" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="72" y="1051.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">openai 系</text><text x="72" y="1073.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">provider_type = openai</text><rect x="308" y="1028" width="236" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="324" y="1051.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">claude 系</text><text x="324" y="1073.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">provider_type = claude</text><rect x="560" y="1028" width="236" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="576" y="1051.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">gemini 系</text><text x="576" y="1073.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">provider_type = gemini</text><rect x="812" y="1028" width="236" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="828" y="1051.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">直通 / 自建</text><text x="828" y="1073.85" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">provider_type = passthrough</text><line x1="570" y1="228" x2="570" y2="252" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><line x1="570" y1="368" x2="570" y2="392" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><line x1="570" y1="536" x2="570" y2="560" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><line x1="570" y1="832" x2="570" y2="892" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><line x1="570" y1="988" x2="570" y2="1024" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><text x="1112" y="142" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">装配与横切</text><rect x="1112" y="150" width="408" height="108" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/><text x="1128" y="173.975" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">配置 + catalog（仅 daemon）</text><text x="1128" y="194.975" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway.toml：listen · uds · 上限 · 代理信任 · workers</text><text x="1128" y="212.975" font-size="12" fill="#334155" font-weight="400" text-anchor="start">catalog.toml：groups · users · tokens · channels · prices</text><text x="1128" y="230.975" font-size="12" fill="#334155" font-weight="400" text-anchor="start">读一次，改需重启；文件与 DB loader 展开成同一种 RouteUnit</text><line x1="1110" y1="208" x2="1086" y2="300" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ad)"/><rect x="1112" y="278" width="408" height="130" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.6"/><text x="1128" y="302.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">gateway-facade（消费者唯一依赖）</text><text x="1128" y="323.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">config：BootConfig · Components · RuntimeKnobs</text><text x="1128" y="341.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">preset：Shape::Relay / NoBilling / Open</text><text x="1128" y="359.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">builder：with_gate · with_stage_before_forward</text><text x="1128" y="377.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">builder：with_stage_after_chain / with_stage</text><text x="1128" y="395.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway：router · pipeline · knobs · graylist</text><line x1="1110" y1="343" x2="1086" y2="460" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ad)"/><rect x="1112" y="428" width="408" height="124" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1128" y="452.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">gateway-metering（横跨两段）</text><text x="1128" y="473.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">准入：QuotaGate 预扣 estimated（内存 Hold）</text><text x="1128" y="491.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">转发：不触碰账务</text><text x="1128" y="509.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">结束：settle 退差额 + 流式扫描计数 + UsageEvent</text><text x="1128" y="527.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">崩溃即丢预扣 —— 权威账本是中心 used_quota</text><line x1="1110" y1="486" x2="1086" y2="700" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ad)"/><rect x="1112" y="572" width="408" height="236" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="1128" y="596.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">互相独立的旁路引擎</text><text x="1128" y="617.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway-cache — 全仓唯一 moka 持有者</text><text x="1128" y="635.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  容量 + TTL + 加权尺寸；响应缓存键按 user+group 隔离</text><text x="1128" y="653.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway-security — Aho-corasick 敏感词，无 pipeline 依赖</text><text x="1128" y="671.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  请求侧已接线，响应侧待接（等后续增强 PR）</text><text x="1128" y="689.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway-proxy — 按 channel_key 选节点并租 Client</text><text x="1128" y="707.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  reqwest 走 CONNECT / SOCKS5</text><text x="1128" y="725.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  vless/vmess/ss/trojan 交给 meow-rs 装配</text><text x="1128" y="743.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway-dispatch 的 sticky / 健康 / 令牌表</text><text x="1128" y="761.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  也建在 gateway-cache 的存储原语上</text><rect x="1112" y="828" width="408" height="148" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="1128" y="852.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">RuntimeKnobs（唯一运行时旋钮面）</text><text x="1128" y="873.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">可改：重试策略 · 健康设置 · 限流阈值 · 令牌预算</text><text x="1128" y="891.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">boot 固定（只读视图）：超时 · selector ·</text><text x="1128" y="909.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  digest / sticky · 响应缓存 · 安全词表</text><text x="1128" y="927.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">同一实例与 gate / forward 共享，</text><text x="1128" y="945.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">改一处立即对运行中的链路生效</text><rect x="56" y="1128" width="1464" height="156" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="72" y="1160" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start">三条贯穿全仓的不变量</text><text x="72" y="1192" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start">① 单向依赖：core ← pipeline ← 引擎 ← facade ← daemon；反向边视为设计缺陷</text><text x="72" y="1216" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start">② 热路径只做本地内存操作：判权 / 选路 / 预扣都在内存完成，网络 IO 只出现在 forward 与 proxy</text><text x="72" y="1240" font-size="13.5" fill="#cbd5e1" font-weight="400" text-anchor="start">③ 一个消费者只依赖一个 crate：facade 重导出全部词汇与引擎类型，其余 crate 是实现细节</text><text x="1470" y="1260" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="end">实线 = 请求路径　虚线 = 注入 / 横切</text></svg>