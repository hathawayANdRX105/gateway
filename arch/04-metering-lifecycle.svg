<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1400" height="1010" fill="#ffffff"/><rect x="0" y="0" width="1400" height="118" rx="0" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="700.0" y="52" font-size="29" fill="#f8fafc" font-weight="700" text-anchor="middle">04 · 计费生命周期 —— 预扣、转发、扫描、结算</text><text x="700.0" y="86" font-size="14.5" fill="#94a3b8" font-weight="400" text-anchor="middle">准入时预扣，转发不碰账，结束时结算并产出 UsageEvent；权威账本是中心 used_quota，不是本地预扣</text><text x="48" y="142" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">一条请求的账务时间线</text><rect x="48" y="152" width="316" height="250" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="64" y="178" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">① prehold</text><text x="64" y="198" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">QuotaGate</text><text x="64" y="224" font-size="12" fill="#334155" font-weight="400" text-anchor="start">estimated =</text><text x="64" y="243" font-size="12" fill="#334155" font-weight="400" text-anchor="start">f(prompt tokens,</text><text x="64" y="262" font-size="12" fill="#334155" font-weight="400" text-anchor="start">max_tokens, price)</text><text x="64" y="281" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="300" font-size="12" fill="#334155" font-weight="400" text-anchor="start">余额不足 → 402</text><text x="64" y="319" font-size="12" fill="#334155" font-weight="400" text-anchor="start">凭证 Hold 入 ctx.hold</text><line x1="365" y1="277" x2="379" y2="277" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><rect x="380" y="152" width="316" height="250" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="396" y="178" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">② 转发</text><text x="396" y="198" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">ForwardStage</text><text x="396" y="224" font-size="12" fill="#334155" font-weight="400" text-anchor="start">不触碰任何账务</text><text x="396" y="243" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="396" y="262" font-size="12" fill="#334155" font-weight="400" text-anchor="start">重试 / 换渠道 /</text><text x="396" y="281" font-size="12" fill="#334155" font-weight="400" text-anchor="start">并发闸门 / 缓存</text><text x="396" y="300" font-size="12" fill="#334155" font-weight="400" text-anchor="start">都与账本无关</text><text x="396" y="319" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="396" y="338" font-size="12" fill="#334155" font-weight="400" text-anchor="start">预扣只在内存里占位</text><line x1="697" y1="277" x2="711" y2="277" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><rect x="712" y="152" width="316" height="250" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/><text x="728" y="178" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">③ scan</text><text x="728" y="198" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">流式管道旁路</text><text x="728" y="224" font-size="12" fill="#334155" font-weight="400" text-anchor="start">上游给了 usage</text><text x="728" y="243" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  → 以真实值为准</text><text x="728" y="262" font-size="12" fill="#334155" font-weight="400" text-anchor="start">没给 → StreamScanner</text><text x="728" y="281" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  逐帧累计</text><text x="728" y="300" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="728" y="319" font-size="12" fill="#334155" font-weight="400" text-anchor="start">finish(prompt) →</text><text x="728" y="338" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  (counts, finish_reason)</text><line x1="1029" y1="277" x2="1043" y2="277" stroke="#475569" stroke-width="2.0" marker-end="url(#a)"/><rect x="1044" y="152" width="316" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="1060" y="178" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">④ settle</text><text x="1060" y="198" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">提交点</text><text x="1060" y="224" font-size="12" fill="#334155" font-weight="400" text-anchor="start">settle(&amp;hold, actual)</text><text x="1060" y="243" font-size="12" fill="#334155" font-weight="400" text-anchor="start">退还 estimated − actual</text><text x="1060" y="262" font-size="12" fill="#334155" font-weight="400" text-anchor="start">actual &gt; estimated 则补扣</text><text x="1060" y="281" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="1060" y="300" font-size="12" fill="#334155" font-weight="400" text-anchor="start">产出 UsageEvent</text><text x="1060" y="319" font-size="12" fill="#334155" font-weight="400" text-anchor="start">→ SettleSink::submit</text><text x="1060" y="338" font-size="12" fill="#334155" font-weight="400" text-anchor="start">（同步热路径，须快返回）</text><rect x="48" y="424" width="1304" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="64" y="448" font-size="15" fill="#7f1d1d" font-weight="700" text-anchor="start">失败路径：ctx 析构 → release(&amp;hold) 全额退回</text><text x="64" y="474" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start">hold 挂在 RequestCtx 上而不是 stage 局部变量上，就是为了跟着请求的整个生命周期走 —— 包括提前返回与 panic。</text><text x="64" y="496" font-size="12.5" fill="#7f1d1d" font-weight="400" text-anchor="start">任何后续闸门拒绝、上游失败、客户端断开，预扣都不会漏退。</text><rect x="48" y="540" width="630" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="64" y="564.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">崩溃语义（刻意选择的权衡）</text><text x="64" y="585.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">预扣只存在内存里，崩溃即丢失 —— 这是可接受的：</text><text x="64" y="603.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="621.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">· UsageEvent 落到 WAL，它是权威计费源</text><text x="64" y="639.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">· 账本正确值是中心端收敛后的 used_quota</text><text x="64" y="657.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">· 预扣的作用只是「防止同一进程内把余额透支成负数」，</text><text x="64" y="675.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">  不是持久化记账</text><text x="64" y="693.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="711.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">这条取舍写在 metering/src/lib.rs 顶部，是设计声明不是缺陷。</text><rect x="698" y="540" width="654" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="714" y="564.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">三个端口都在 core 里</text><text x="714" y="585.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Ledger / SettleSink / PriceTable 三个 trait 声明在</text><text x="714" y="603.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway-core::metering，metering 引擎重导出它们。</text><text x="714" y="621.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="714" y="639.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">原因很实际：apps 侧的计费 crate 要能实现这些 trait</text><text x="714" y="657.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">而不依赖 metering 引擎 —— 端口放词汇层，引擎只做算术。</text><text x="714" y="675.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="714" y="693.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">SettleSink::submit 在热路径同步调用（流结束 / 提交点），</text><text x="714" y="711.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">实现必须非阻塞或快速返回；落库、推送自己 spawn 到后台。</text><rect x="48" y="760" width="1304" height="110" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="64" y="784.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">估算的单一来源（dispatch → metering 这条依赖边的全部理由）</text><text x="64" y="805.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">gateway-metering::estimate 的 prompt-token 估算器同时被两处使用：① 准入时的配额估算（QuotaGate）；② dispatch 的 context-fit 判断（prompt + max_tokens 是否超出渠道窗口）。</text><text x="64" y="823.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">算术只能有一份 —— 两处若各写一遍，估算与判权就会慢慢漂移，而漂移在计费上是不可接受的。</text><text x="64" y="841.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">CalibrationLog 是挂在 /readyz 上的环形缓冲，收集「估算值 vs 上游上报值」配对样本，供后续拟合权重；它让估算误差可观测，而不是让估算变精确。</text><text x="48" y="900" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">读代码入口</text><text x="48" y="926" font-size="12" fill="#334155" font-weight="400" text-anchor="start">metering/src/lib.rs 顶部（三职责 + 崩溃语义） · core/src/metering.rs:90（Ledger 三方法） · metering/src/settle.rs:38（settle_event 算术）</text><text x="48" y="948" font-size="12" fill="#334155" font-weight="400" text-anchor="start">metering/src/scanner.rs:73（StreamScanner） · forward/src/stage_commit.rs（提交点：结算 + 缓存写入） · gate/src/quota.rs（预扣入口）</text></svg>