<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1400" height="1080" fill="#ffffff"/><rect x="0" y="0" width="1400" height="118" rx="0" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="700.0" y="52" font-size="29" fill="#f8fafc" font-weight="700" text-anchor="middle">05 · 协议适配 —— 每方言一个双向 codec + IR 两跳</text><text x="700.0" y="86" font-size="14.5" fill="#94a3b8" font-weight="400" text-anchor="middle">codec = coder+decoder：一种方言的请求/响应双向翻译器。N 种格式只需 N 个，不是 N×(N-1) 个</text><text x="48" y="142" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">两种做法的对比</text><rect x="48" y="152" width="640" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="64" y="176.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">直连转换（被否决）</text><text x="64" y="197.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">OpenAI ↔ Claude · OpenAI ↔ Gemini · OpenAI ↔ Responses</text><text x="64" y="215.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Claude ↔ Gemini · Claude ↔ Responses · Gemini ↔ Responses …</text><text x="64" y="233.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="251.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">4 种格式 = 12 条有向边，每条都要单独写、单独测、单独维护。</text><text x="64" y="269.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">加第 5 种格式要新增 8 条边；任何一条边漏改，就出现</text><text x="64" y="287.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">「请求转换了、响应没转换」这类不对称缺陷。</text><rect x="48" y="356" width="640" height="190" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="64" y="380.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">IR 两跳（当前实现）</text><text x="64" y="401.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">每种方言实现一个 FormatCodec：decode（方言→IR）+ encode（IR→方言），双向共用。</text><text x="64" y="419.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="437.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">跨格式 = src.decode → IR → dst.encode，永远两跳。</text><text x="64" y="455.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="473.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">4 种格式 = 4 个 codec。加第 5 种格式只加 1 个文件，</text><text x="64" y="491.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">立刻与已有全部格式互通 —— 组合数从 N² 降到 N。</text><text x="720" y="142" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">FormatRegistry::with_defaults()</text><rect x="720" y="152" width="632" height="190" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="736" y="176.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">注册的四个 codec + 一种旁路</text><text x="736" y="198.125" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">OpenAiCodec        /v1/chat/completions</text><text x="736" y="216.875" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">ResponsesCodec     /v1/responses（同名不同形，独立 codec）</text><text x="736" y="235.625" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">ClaudeCodec        /v1/messages（Anthropic Messages）</text><text x="736" y="254.375" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">GeminiCodec        /v1beta/models/{model}:{verb}</text><text x="736" y="273.125" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">Passthrough        其他厂商：不转换，字节直通</text><text x="48" y="584" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="start">IR 是唯一的中转站</text><rect x="820" y="606" width="240" height="128" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><text x="940" y="646" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="middle">IR</text><text x="940" y="674" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="middle">LlmRequest · LlmResponse</text><text x="940" y="694" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="middle">StreamEvent · ContentBlock</text><text x="940" y="716" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">未知字段逃生舱</text><rect x="520" y="576" width="190" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><text x="615" y="603" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">OpenAI Chat</text><line x1="712" y1="597" x2="818" y2="670" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><rect x="520" y="634" width="190" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><text x="615" y="661" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">OpenAI Responses</text><line x1="712" y1="655" x2="818" y2="670" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><rect x="520" y="692" width="190" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><text x="615" y="719" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Claude</text><line x1="712" y1="713" x2="818" y2="670" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><rect x="520" y="750" width="190" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><text x="615" y="777" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Gemini</text><line x1="712" y1="771" x2="818" y2="670" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/><text x="48" y="700" font-size="12.5" fill="#475569" font-weight="600" text-anchor="start">每个 codec 都实现两件事：</text><text x="48" y="724" font-size="12" fill="#334155" font-weight="400" text-anchor="start">decode(自己的格式) → IR</text><text x="48" y="746" font-size="12" fill="#334155" font-weight="400" text-anchor="start">encode(IR) → 自己的格式</text><text x="48" y="772" font-size="11.8" fill="#64748b" font-weight="400" text-anchor="start">注册顺序无关；同 format 重复注册会替换。</text><text x="48" y="796" font-size="11.8" fill="#64748b" font-weight="400" text-anchor="start">跨格式永远两跳：src.decode → IR → dst.encode。</text><rect x="48" y="820" width="640" height="190" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/><text x="64" y="844.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">流式的不对称设计</text><text x="64" y="865.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">decode_event  → 无状态（每个 SSE 事件独立解码）</text><text x="64" y="883.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">StreamEncoder → 有状态（&amp;mut self 持有块边界与累积的 tool 片段）</text><text x="64" y="901.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="919.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">为什么这样切：Claude 的 input_json_delta → OpenAI 的</text><text x="64" y="937.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">tool_calls[].arguments 是逐事件 1:1 映射，解码侧确实不需要状态；</text><text x="64" y="955.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">真正需要跨事件状态的是编码侧。</text><text x="64" y="973.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="64" y="991.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">把状态放在真正需要它的那一侧，解码器就能被任意并发复用。</text><rect x="720" y="820" width="632" height="190" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="736" y="844.25" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">为什么转换闭环在 forward 里</text><text x="736" y="865.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">请求方向与响应方向必须用同一套 codec，而入站方言由请求路径决定、</text><text x="736" y="883.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">上游方言由渠道的 provider_type 决定 —— 两者只在</text><text x="736" y="901.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">forward::pipeline 这一个函数里同时可见。</text><text x="736" y="919.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start"></text><text x="736" y="937.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">历史实现把响应转换放在 protocol-bridge 的 stage 里，并硬编码</text><text x="736" y="955.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">「响应源协议 = OpenAI」；流式路径干脆不转换，导致流式的</text><text x="736" y="973.25" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Claude / Gemini 客户端永远收到 OpenAI 事件形状（代码注释记为 G2）。</text></svg>